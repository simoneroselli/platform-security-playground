# 1️⃣ Define WHAT actions are allowed (The Role)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redis-reader-role
  namespace: vote-app
rules:
- apiGroups: [""]           # Core API group (where Pods live)
  resources: ["pods"]       # Resource type
  resourceNames: ["redis"]  # Strict scoping: ONLY the pod named "redis"
  verbs: ["get"]            # Minimal action (Read-only single object fetch)
---
# 2️⃣ Link the ServiceAccount to the Actions (The RoleBinding)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vote-frontend-redis-binding
  namespace: vote-app
subjects:
- kind: ServiceAccount
  name: vote-frontend-sa    # WHO gets the power
  namespace: vote-app
roleRef:
  kind: Role
  name: redis-reader-role   # THE ROLE being applied
  apiGroup: rbac.authorization.k8s.io